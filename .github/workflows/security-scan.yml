name: Security Scan

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM
  workflow_dispatch:

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    name: Dependency Vulnerability Check
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: pip install -r requirements.txt
    
    - name: Run safety check
      run: pip install safety && safety check --json > safety-report.json || true
    
    - name: Upload safety report
      uses: actions/upload-artifact@v4
      with:
        name: safety-report
        path: safety-report.json

  secrets-scan:
    runs-on: ubuntu-latest
    name: Secrets Detection
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: TruffleHog Secret Scanning
      uses: trufflesecurity/trufflehog@main
      continue-on-error: true
      with:
        path: ./
        base: ${{ github.event.repository.default_branch }}
        head: HEAD
        extra_args: --debug

  sast:
    runs-on: ubuntu-latest
    name: Static Analysis
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: pip install -r requirements.txt
    
    - name: Run Pylint
      run: pip install pylint && pylint src --exit-zero --output-format=json > pylint-report.json || true
    
    - name: Upload Pylint report
      uses: actions/upload-artifact@v4
      with:
        name: pylint-report
        path: pylint-report.json

  container-scan:
    runs-on: ubuntu-latest
    name: Container Security Scan
    permissions:
      contents: read
      security-events: write
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build image for scanning
      uses: docker/build-push-action@v4
      with:
        context: .
        load: true
        tags: consumesafe:scan
    
    - name: Run Grype scan
      id: scan
      uses: anchore/scan-action@v3
      continue-on-error: true
      with:
        image: consumesafe:scan
        fail-build: false
    
    - name: Upload Grype results
      uses: github/codeql-action/upload-sarif@v3
      if: always() && steps.scan.outputs.sarif != ''
      with:
        sarif_file: ${{ steps.scan.outputs.sarif }}
