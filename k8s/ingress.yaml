apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: consumesafe-ingress
  namespace: consumesafe
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - consumesafe.example.com
    secretName: consumesafe-tls
  rules:
  - host: consumesafe.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: consumesafe-api
            port:
              number: 80
